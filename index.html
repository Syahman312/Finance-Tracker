Object.entries(G).forEach(([k,l])=>{if(hid.includes(k)||tr.some(n=>n&&(n.includes(k)||k.includes(n))))return;l.sort((a,b)=>a.date.localeCompare(b.date));const ms=new Set(l.map(t=>t.date.slice(0,7)));if(ms.size<3||ms.size<l.length*.8)return;

const l=Object.values(m);l.forEach(x=>x.d=geo&&x.geo?geoKm(geo,x.geo):null);return l.sort((a,b)=>(a.d??1e9)-(b.d??1e9)||b.c-a.c)}
