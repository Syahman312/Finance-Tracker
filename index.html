+det('gd','🥇 Gold price',`<small>Price source</small><select onchange="cfg('gsrc',this.value)"><option value="spot" ${(c.gsrc||'spot')=='spot'?'selected':''}>Live gold price (XAU → MYR, automatic)</option><option value="web" ${c.gsrc=='web'?'selected':''}>A website I choose (via my Google script)</option><option value="manual" ${c.gsrc=='manual'?'selected':''}>Manual price</option></select>
<small>Adjust % (dealer buy/sell difference or purity)</small><input type="number" step="0.1" value="${c.gadj||0}" onchange="cfg('gadj',parseFloat(this.value)||0)"><small>Manual price per gram</small><input type="number" step="0.01" value="${c.gman||''}" onchange="cfg('gman',parseFloat(this.value)||0)">
<small>Website page address (for "a website I choose")</small><input value="${esc(c.gurl||'')}" onchange="cfg('gurl',this.value.trim())"><small>Text just before the price on that page</small><input value="${esc(c.gafter||'')}" onchange="cfg('gafter',this.value)">
<small>Latest: ${c.gp?money(c.gp)+' per gram · '+c.gd:'none yet'}</small><button class="s" onclick="goldRefresh()">Update gold price now</button>`)
+det('lk','👥 Linked ledgers (monitor each other)',`${links().map(l=>`<div class="fl" style="margin:6px 0"><span>👁 ${esc(l.name)}</span><a onclick="delLink('${l.id}')">✕</a></div>`).join('')||'<small>No linked ledgers yet</small>'}<h4>Add a ledger</h4><input id="lk_n" placeholder="Name (e.g. Aisyah)"><input id="lk_u" placeholder="Their Web App URL"><input id="lk_k" placeholder="Their view key"><button class="s" onclick="addLink()">Add</button><small>They set up their own copy of the app and share the Web App URL and view key with you. You can view their ledger from the switch at the top; it is read only.</small>`)
+det('sh',`🛒 Shops &amp; brands (${S.shops.length})`,S.shops.map(x=>`<div class="row5"><label class="lgl">${lg(x)}<input type="file" accept="image/*" hidden onchange="logoUp('shops','${x.id}',this.files[0])"></label><input value="${esc(x.name)}" onchange="upd('shops','${x.id}','name',this.value)"><input value="${esc(x.i||'')}" placeholder="emoji" onchange="upd('shops','${x.id}','i',this.value)"><input type="color" value="${x.color||'#94a3b8'}" onchange="upd('shops','${x.id}','color',this.value)"><button class="d" onclick="rm('shops','${x.id}')">×</button></div>`).join('')+`<button class="s" onclick="put('shops',{id:uid(),name:'New shop',i:'🏷️',color:'#94a3b8'})">+ Add shop</button>`)

+det('bk','💾 Backup',`<button class="s" onclick="exp()">Export JSON</button><input type="file" accept=".json" onchange="imp(this.files[0])">`)}

/* ---------- transaction form ---------- */
function edit(id){const t=TX().find(x=>x.id==id);
if(t&&t.f){faEd(t.id.slice(2));return}
cur=t?structuredClone(t):{id:'',date:today(),desc:'',amt:0,cat:(S.cats[0]||{}).id,acc:fa||(S.accs[0]||{}).id,note:'',att:[]};cur.att=cur.att||[];cur.rem=[];
$('#m').innerHTML=`<div><h3>${t?'Edit':'New'} transaction</h3>${t&&isRecd(t)?'<small>🔒 Reconciled. Changing the amount, date or account will un-reconcile it.</small>':''}${t&&t.g?'<small>🔗 From Garage — changes here only affect Ledger, not Garage.</small>':''}<div class="seg" id="f_seg">${[['e','Expense'],['i','Income'],['t','Transfer'],['f','Fixed asset']].map(([k,n])=>`<a id="ts_${k}" onclick="setT('${k}')">${n}</a>`).join('')}</div><div><select id="f_type" style="display:none" onchange="tg()"><option value="e">Expense</option><option value="i" ${cur.amt>0&&!cur.tr?'selected':''}>Income</option><option value="t" ${cur.tr?'selected':''}>Transfer / repayment</option><option value="f">Fixed asset</option></select>
<input id="f_amt" type="number" step="0.01" inputmode="decimal" placeholder="Amount" value="${Math.abs(cur.amt)||''}"></div>
<input id="f_date" type="date" value="${cur.date}"><input id="f_desc" placeholder="Description / payee" value="${esc(cur.desc)}">
<div id="f_c"><select id="f_cat">${catOpts(cur.amt>0&&!cur.tr?'i':'e',cur.cat)}</select></div><div class="two"><select id="f_acc">${opts(S.accs,cur.acc,a=>esc(a.name))}</select><select id="f_to">${opts(S.accs,cur.to,a=>'→ '+esc(a.name))}</select></div>
<input id="f_shop" list="shl" placeholder="Shop / brand (e.g. Shell, Shopee)" value="${esc((S.shops.find(x=>x.id==cur.shop)||{}).name||'')}"><datalist id="shl">${S.shops.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
<div id="f_fx" style="display:none"><small>A fixed asset is not an expense. Its cost is spread over its useful life as depreciation.</small><div class="two"><div><small>Useful life (years)</small><input id="fx_l" type="number" step="0.5" value="5"></div><div><small>Residual value</small><input id="fx_r" type="number" step="0.01" value="0"></div></div>
<small>Depreciation method</small><select id="fx_m" onchange="fxm()"><option value="sl">Straight-line</option><option value="rb">Reducing balance</option><option value="cu">Custom formula</option></select><div id="fx_rb" style="display:none"><small>Rate % per year</small><input id="fx_p" type="number" step="0.1" value="20"></div><div id="fx_cu" style="display:none"><small>Yearly formula (cost, res, life, rate, n, nbv)</small><input id="fx_e" value="(cost-res)/life"></div>
<label class="fl"><span>Already owned (don't take it from an account)</span><input type="checkbox" id="fx_own" style="width:auto"></label></div>
<select id="f_tag"><option value="">Tax relief: none</option>${RLS.filter(r=>r.tag).map(r=>`<option value="${r.k}" ${cur.tag==r.k?'selected':''}>${esc(r.n)}</option>`).join('')}<option value="don" ${cur.tag=='don'?'selected':''}>Donation to an approved institution</option><option value="zakat" ${cur.tag=='zakat'?'selected':''}>Zakat / fitrah</option></select>
<input id="f_note" placeholder="Note" value="${esc(cur.note)}">
${cur.att.map(a=>`<div class="fl"><a onclick="pv('${a.id}')">📎 ${esc(a.name)}</a><a href="${esc(a.link)}" target="_blank" rel="noopener">↗</a><a onclick="cur.rem.push('${a.id}');cur.att=cur.att.filter(x=>x.id!='${a.id}');event.target.parentElement.remove()">✕</a></div>`).join('')}
<small>Attach receipts (PDF or image) — saved to Google Drive</small><input id="f_files" type="file" multiple accept="image/*,application/pdf">
<button onclick="saveTx('${cur.id}')">Save</button>${t&&t.g?`<button class="s" onclick="gReset('${cur.id}')">Reset to Garage</button><button class="d" onclick="gHide('${cur.id}')">Hide from Ledger</button>`:t?`<button class="d" onclick="delTx('${cur.id}')">Delete</button>`:''}<button class="s" onclick="closeM()">Cancel</button></div>`;
$('#m').className='modal show';tg()}
function setT(k){$('#f_type').value=k;tg()}
function fxm(){const m=$('#fx_m');if(!m)return;$('#fx_rb').style.display=m.value=='rb'?'':'none';$('#fx_cu').style.display=m.value=='cu'?'':'none'}
function tg(){const v=$('#f_type').value,t=v=='t',f=v=='f';if(!t&&!f){const c=$('#f_cat');c.innerHTML=catOpts(v=='i'?'i':'e',c.value)}
$('#f_to').style.display=t?'':'none';$('#f_c').style.display=t||f?'none':'';$('#f_shop').style.display=t||f?'none':'';$('#f_tag').style.display=v=='e'?'':'none';$('#f_fx').style.display=f?'':'none';
['e','i','t','f'].forEach(x=>{const a=$('#ts_'+x);if(a)a.className=v==x?'on':''});$('#f_desc').placeholder=f?'Asset name (e.g. Laptop, Car)':'Description / payee';fxm()}
const closeM=()=>{$('#m').className='modal'};
async function saveTx(id){const g=x=>$('#f_'+x).value,a=Math.abs(parseFloat(g('amt')))||0;
if(!a)return setStatus('Enter an amount');
if(g('type')=='f'){const life=parseFloat($('#fx_l').value)||0;if(!g('desc')||!life)return setStatus('Enter the asset name and its useful life');if(String(id).startsWith('g:'))return setStatus('Garage entries cannot become fixed assets');
if(id)rm('tx',id);put('fixed',{id:uid(),name:g('desc'),date:g('date'),cost:a,res:parseFloat($('#fx_r').value)||0,life,m:$('#fx_m').value,rate:parseFloat($('#fx_p').value)||0,expr:$('#fx_e').value,acc:$('#fx_own').checked?'':g('acc')});closeM();return}
if(g('type')=='t'&&g('to')==g('acc'))return setStatus('Choose two different accounts');
const t={...cur,id:id||uid(),date:g('date'),desc:g('desc'),amt:g('type')=='e'?-a:a,tr:g('type')=='t'?1:0,to:g('type')=='t'?g('to'):'',cat:g('cat'),acc:g('acc'),note:g('note'),shop:shopId(),tag:g('type')=='e'?g('tag'):''},files=[...$('#f_files').files],rem=cur.rem||[];delete t.rem;
if(files.length){try{setStatus('Uploading…');const f=await path(S.cfg.root,'Receipts',t.date.slice(0,7));
for(const x of files){const r=await upload(x,f,safe(`${t.date}_${t.desc.slice(0,30)}_${x.name}`));t.att.push({id:r.id,name:x.name,link:r.webViewLink})}}
catch(e){return setStatus('Upload failed: '+e.message)}}
if(t.g){put('govr',{id:t.id,h:0,f:{date:t.date,desc:t.desc,amt:t.amt,cat:t.cat,acc:t.acc,shop:t.shop,note:t.note,att:t.att,tag:t.tag}});closeM();return}
if(rem.length){try{await trash(rem)}catch(e){}}const ot=S.tx.find(x=>x.id==t.id);if(ot&&(ot.amt!=t.amt||ot.date!=t.date||ot.acc!=t.acc||(ot.to||'')!=(t.to||''))&&unrec(ot))setStatus('This transaction was reconciled — it is now un-reconciled because you changed it');put('tx',t);closeM()}
async function upStm(){const files=[...$('#s_files').files],a=$('#s_acc').value,m=$('#s_m').value,y=$('#s_y').value;if(!files.length||!a)return setStatus('Pick an account and a file');
try{setStatus('Uploading…');const d=await path(S.cfg.root,'Statements',safe(acc(a).name),y);
for(const x of files){const r=await upload(x,d,safe(`${y}-${m}_${x.name}`));S.stm.push({id:uid(),u:now(),fid:r.id,acc:a,month:y+'-'+m,name:x.name,link:r.webViewLink})}save();setStatus('Uploaded')}
catch(e){setStatus('Upload failed: '+e.message)}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='ledger-backup.json';a.click()}
async function imp(f){if(!f)return;try{merge(JSON.parse(await f.text()));save()}catch(e){setStatus('Bad file')}}
