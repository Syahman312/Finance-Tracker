<!doctype html>
<html lang="en" data-t="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115"><title>Ledger</title>
<style>
:root{--bg:#0f1115;--fg:#eceef2;--card:#1a1d24;--mut:#8b93a1;--acc:#4f8cff;--g:#34c38f;--r:#f46a6a}
html[data-t=light]{--bg:#f4f5f8;--fg:#1b1e25;--card:#fff;--mut:#6b7280}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
header span{color:var(--mut);font-size:12px}
main{max-width:900px;margin:auto;padding:0 12px 130px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;text-align:center;padding:8px 0;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;font-size:18px}
nav a small{font-size:11px}nav a.on{color:var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;z-index:7;box-shadow:0 4px 14px #0006}
.card{background:var(--card);border-radius:12px;padding:12px;margin:8px 0}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.row3 .card{margin:0;font-size:12px;color:var(--mut)}
h3{margin:4px 0;color:var(--fg);font-size:16px}h4{margin:16px 4px 4px;color:var(--mut);font-weight:600}
.g{color:var(--g)!important}.r{color:var(--r)!important}
.scroll{overflow-x:auto;display:flex;gap:8px}.scroll .card{min-width:150px;margin:0;cursor:pointer}
.mn{display:flex;justify-content:center;gap:24px;align-items:center;font-size:18px;margin:6px}.mn a{cursor:pointer;padding:4px 12px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{margin:10px 0}.bar i{display:block;height:6px;border-radius:3px;margin-top:4px}
.tw{overflow-x:auto;background:var(--card);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 8px;text-align:left;white-space:nowrap}th{color:var(--mut)}
.n{text-align:right}tr{border-bottom:1px solid #8883}tr[onclick]{cursor:pointer}
input,select,button,textarea{font:inherit;padding:9px;border-radius:8px;border:1px solid #8885;background:var(--bg);color:var(--fg);width:100%;margin:4px 0}
button{background:var(--acc);color:#fff;border:0}button.s{background:#8883;color:var(--fg)}button.d{background:var(--r)}
input[type=color]{padding:2px;height:40px}small{color:var(--mut)}a{color:var(--acc)}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:9;overflow:auto}.modal.show{display:block}
.modal>div{background:var(--card);max-width:480px;margin:5vh auto;padding:16px;border-radius:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:60px 1fr 60px 40px;gap:6px}
</style></head><body>
<div id="app"></div><div id="m" class="modal"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const K='ledger.data',CID='ledger.cid',ON='ledger.on',FM='application/vnd.google-apps.folder';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36),now=()=>Date.now(),today=()=>new Date().toLocaleDateString('en-CA');
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{cfg:{name:'Ledger',cur:'RM',accent:'#4f8cff',theme:'dark',root:'Finance Tracker',u:0},
cats:[['c1','Food','🍜','#f59e0b'],['c2','Transport','🚗','#3b82f6'],['c3','Bills','💡','#a855f7'],['c4','Shopping','🛍️','#ec4899'],['c5','Health','🏥','#ef4444'],['c6','Salary','💰','#22c55e'],['c7','Other','📦','#94a3b8']].map(([id,name,i,color])=>({id,name,i,color,u:0})),
accs:[['a1','Cash','#22c55e'],['a2','Bank','#4f8cff']].map(([id,name,color])=>({id,name,color,open:0,u:0})),tx:[],stm:[],del:{}};
let tab='ov',ym=today().slice(0,7),fa='',q='',cur=null,status='Local only',tok=null,tokExp=0,busy=false,timer;
const acc=id=>S.accs.find(a=>a.id==id)||{name:'?',color:'#888',open:0};
const cat=id=>S.cats.find(c=>c.id==id)||{name:'Uncategorised',i:'❓',color:'#888'};
const sum=l=>l.reduce((s,t)=>s+t.amt,0),bal=a=>(a.open||0)+sum(S.tx.filter(t=>t.acc==a.id));
const money=n=>(n<0?'-':'')+S.cfg.cur+' '+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const opts=(l,sel,f)=>l.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${f(x)}</option>`).join('');
const setStatus=m=>{status=m;const e=$('#stat');if(e)e.textContent=m};

/* ---------- storage & merge ---------- */
function save(){localStorage.setItem(K,JSON.stringify(S));render();clearTimeout(timer);timer=setTimeout(sync,1500)}
function put(k,x){const i=S[k].findIndex(y=>y.id==x.id);x.u=now();i<0?S[k].push(x):S[k][i]=x;save()}
function rm(k,id){S[k]=S[k].filter(x=>x.id!=id);S.del[id]=now();save()}
function upd(k,id,f,v){const x=S[k].find(y=>y.id==id);x[f]=v;put(k,x)}
function cfg(f,v){S.cfg[f]=v;S.cfg.u=now();save()}
function merge(r){const del={...S.del};for(const k in r.del||{})del[k]=Math.max(del[k]||0,r.del[k]);
for(const k of['tx','stm','cats','accs']){const m=new Map();for(const x of[...S[k],...(r[k]||[])]){const o=m.get(x.id);if(!o||x.u>o.u)m.set(x.id,x)}S[k]=[...m.values()].filter(x=>!(del[x.id]>=x.u))}
S.del=del;if(r.cfg&&(r.cfg.u||0)>(S.cfg.u||0))S.cfg=r.cfg}

/* ---------- Google Drive ---------- */
function auth(){return new Promise((res,rej)=>{const id=localStorage.getItem(CID);
if(!id)return rej(new Error('Add your Google Client ID in Settings'));if(!window.google)return rej(new Error('Google script not loaded (offline?)'));
google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive.file',
callback:r=>{if(r.error)return rej(new Error(r.error));tok=r.access_token;tokExp=now()+r.expires_in*1000-60000;localStorage.setItem(ON,'1');res()},
error_callback:e=>rej(new Error(e.type||'auth failed'))}).requestAccessToken({prompt:''})})}
async function api(url,o={}){if(!tok||now()>tokExp)await auth();
const r=await fetch(url,{...o,headers:{Authorization:'Bearer '+tok,...(o.headers||{})}});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));return r}
const D='https://www.googleapis.com/drive/v3/files';
async function find(name,parent,mime){const qs=`name='${name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}' and trashed=false`+(parent?` and '${parent}' in parents`:'')+(mime?` and mimeType='${mime}'`:'');
return((await(await api(D+'?fields=files(id)&q='+encodeURIComponent(qs))).json()).files[0]||{}).id}
async function folder(name,parent){let id=await find(name,parent,FM);if(id)return id;
return(await(await api(D+'?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:FM,...(parent?{parents:[parent]}:{})})})).json()).id}
async function path(...p){let id=null;for(const n of p)id=await folder(n,id);return id}
async function upload(file,parent,name,existing){const fd=new FormData();
fd.append('metadata',new Blob([JSON.stringify({name,...(existing?{}:{parents:[parent]})})],{type:'application/json'}));fd.append('file',file);
return(await api(`https://www.googleapis.com/upload/drive/v3/files${existing?'/'+existing:''}?uploadType=multipart&fields=id,webViewLink`,{method:existing?'PATCH':'POST',body:fd})).json()}
async function sync(){if(busy||!localStorage.getItem(ON))return;busy=true;setStatus('Syncing…');
try{const root=await path(S.cfg.root),id=await find('data.json',root);
if(id)merge(await(await api(`${D}/${id}?alt=media`)).json());
await upload(new Blob([JSON.stringify(S)],{type:'application/json'}),root,'data.json',id);
localStorage.setItem(K,JSON.stringify(S));setStatus('Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))}
catch(e){setStatus('Sync failed — tap Settings › Sync');console.warn(e)}busy=false;render()}
async function connect(){try{await auth();await sync()}catch(e){setStatus(e.message)}}
const safe=s=>s.replace(/[\/\\:*?"<>|]/g,'-');

/* ---------- views ---------- */
const go=k=>{tab=k;render();scrollTo(0,0)};
const mo=d=>{const[y,m]=ym.split('-').map(Number),n=new Date(y,m-1+d,1);ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');render()};
function render(){const h=document.documentElement;h.dataset.t=S.cfg.theme;h.style.setProperty('--acc',S.cfg.accent);
const v={ov,tx:reg,st:stv,set:sett}[tab]();
$('#app').innerHTML=`<header><b>${esc(S.cfg.name)}</b><span id="stat">${esc(status)}</span></header><main>${v}</main>
<nav>${[['ov','📊','Overview'],['tx','🧾','Register'],['st','🏦','Statements'],['set','⚙️','Settings']].map(([k,i,l])=>`<a class="${tab==k?'on':''}" onclick="go('${k}')">${i}<small>${l}</small></a>`).join('')}</nav>
${tab=='ov'||tab=='tx'?'<button class="fab" onclick="edit()">+</button>':''}`}
function ov(){const m=S.tx.filter(t=>t.date.startsWith(ym)),inc=sum(m.filter(t=>t.amt>0)),exp=-sum(m.filter(t=>t.amt<0)),by={};
m.filter(t=>t.amt<0).forEach(t=>by[t.cat]=(by[t.cat]||0)-t.amt);
return`<div class="mn"><a onclick="mo(-1)">‹</a><b>${ym}</b><a onclick="mo(1)">›</a></div>
<div class="row3"><div class="card">Income<h3 class="g">${money(inc)}</h3></div><div class="card">Expenses<h3 class="r">${money(exp)}</h3></div><div class="card">Net<h3>${money(inc-exp)}</h3></div></div>
<h4>Accounts</h4><div class="scroll">${S.accs.map(a=>`<div class="card" style="border-left:4px solid ${a.color}" onclick="fa='${a.id}';go('tx')"><small>${esc(a.name)}</small><h3>${money(bal(a))}</h3></div>`).join('')}</div>
<h4>Spending by category</h4><div class="card">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{const k=cat(c);return`<div class="bar"><div class="fl"><span>${k.i} ${esc(k.name)}</span><span>${money(v)}</span></div><i style="width:${v/exp*100}%;background:${k.color}"></i></div>`}).join('')||'<small>No expenses this month</small>'}</div>`}
function reg(){let run=fa?acc(fa).open||0:null;
const rows=S.tx.filter(t=>(!fa||t.acc==fa)&&(!q||(t.desc+t.note).toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>a.date.localeCompare(b.date)||a.u-b.u)
.map(t=>{if(run!==null)run+=t.amt;return{t,run}}).reverse().slice(0,300);
return`<div class="two"><select onchange="fa=this.value;render()"><option value="">All accounts</option>${opts(S.accs,fa,a=>esc(a.name))}</select><input placeholder="Search" value="${esc(q)}" onchange="q=this.value;render()"></div>
<div class="tw"><table><tr><th>Date<th>Description<th>Category<th>Account<th class="n">Amount<th class="n">${fa?'Balance':''}</tr>
${rows.map(({t,run})=>{const k=cat(t.cat);return`<tr onclick="edit('${t.id}')"><td>${t.date}<td>${esc(t.desc)} ${t.att&&t.att.length?'📎'+t.att.length:''}<td>${k.i} ${esc(k.name)}<td>${esc(acc(t.acc).name)}<td class="n ${t.amt<0?'r':'g'}">${money(t.amt)}<td class="n">${run!==null?money(run):''}`}).join('')||'<tr><td colspan="6"><small>No transactions yet — tap +</small>'}</table></div>`}
function stv(){return`<h4>Upload bank statement</h4><div class="card"><div class="two"><select id="s_acc">${opts(S.accs,'',a=>esc(a.name))}</select><input id="s_mon" type="month" value="${ym}"></div>
<input id="s_files" type="file" multiple accept="application/pdf,image/*,.csv,.xlsx"><button onclick="upStm()">Upload to Google Drive</button></div>
<h4>Statements</h4>${[...S.stm].sort((a,b)=>b.month.localeCompare(a.month)).map(s=>`<div class="card fl"><a href="${esc(s.link)}" target="_blank" rel="noopener">📄 ${esc(s.name)}</a><small>${esc(acc(s.acc).name)} · ${s.month}</small><a onclick="if(confirm('Remove from list? (file stays in Drive)'))rm('stm','${s.id}')">🗑</a></div>`).join('')||'<small>None yet</small>'}`}
function sett(){const c=S.cfg,inp=(f,t='text')=>`<input type="${t}" value="${esc(c[f])}" onchange="cfg('${f}',this.value)">`;
return`<h4>Google Drive sync</h4><div class="card"><small>OAuth Client ID</small><input value="${esc(localStorage.getItem(CID)||'')}" onchange="localStorage.setItem(CID,this.value.trim())">
<small>Drive root folder name</small>${inp('root')}<button onclick="connect()">Connect &amp; sync now</button></div>
<h4>Appearance</h4><div class="card"><small>App name</small>${inp('name')}<div class="two"><div><small>Currency symbol</small>${inp('cur')}</div><div><small>Accent colour</small>${inp('accent','color')}</div></div>
<small>Theme</small><select onchange="cfg('theme',this.value)"><option value="dark" ${c.theme=='dark'?'selected':''}>Dark</option><option value="light" ${c.theme=='light'?'selected':''}>Light</option></select></div>
<h4>Categories</h4><div class="card">${S.cats.map(k=>`<div class="three"><input value="${esc(k.i)}" onchange="upd('cats','${k.id}','i',this.value)"><input value="${esc(k.name)}" onchange="upd('cats','${k.id}','name',this.value)"><input type="color" value="${k.color}" onchange="upd('cats','${k.id}','color',this.value)"><button class="d" onclick="rm('cats','${k.id}')">×</button></div>`).join('')}
<button class="s" onclick="put('cats',{id:uid(),name:'New',i:'📦',color:'#94a3b8'})">+ Add category</button></div>
<h4>Accounts</h4><div class="card">${S.accs.map(a=>`<div class="three" style="grid-template-columns:1fr 90px 60px 40px"><input value="${esc(a.name)}" onchange="upd('accs','${a.id}','name',this.value)"><input type="number" step="0.01" value="${a.open||0}" title="Opening balance" onchange="upd('accs','${a.id}','open',parseFloat(this.value)||0)"><input type="color" value="${a.color}" onchange="upd('accs','${a.id}','color',this.value)"><button class="d" onclick="if(confirm('Delete account?'))rm('accs','${a.id}')">×</button></div>`).join('')}
<button class="s" onclick="put('accs',{id:uid(),name:'New account',color:'#4f8cff',open:0})">+ Add account</button><small>Name · opening balance · colour</small></div>
<h4>Backup</h4><div class="card"><button class="s" onclick="exp()">Export JSON</button><input type="file" accept=".json" onchange="imp(this.files[0])"></div>`}

/* ---------- transaction form ---------- */
function edit(id){const t=S.tx.find(x=>x.id==id);cur=t?structuredClone(t):{id:'',date:today(),desc:'',amt:0,cat:(S.cats[0]||{}).id,acc:fa||(S.accs[0]||{}).id,note:'',att:[]};cur.att=cur.att||[];
$('#m').innerHTML=`<div><h3>${t?'Edit':'New'} transaction</h3><div class="two"><select id="f_type"><option value="e">Expense</option><option value="i" ${cur.amt>0?'selected':''}>Income</option></select>
<input id="f_amt" type="number" step="0.01" inputmode="decimal" placeholder="Amount" value="${Math.abs(cur.amt)||''}"></div>
<input id="f_date" type="date" value="${cur.date}"><input id="f_desc" placeholder="Description / payee" value="${esc(cur.desc)}">
<div class="two"><select id="f_cat">${opts(S.cats,cur.cat,k=>k.i+' '+esc(k.name))}</select><select id="f_acc">${opts(S.accs,cur.acc,a=>esc(a.name))}</select></div>
<input id="f_note" placeholder="Note" value="${esc(cur.note)}">
${cur.att.map(a=>`<div class="fl"><a href="${esc(a.link)}" target="_blank" rel="noopener">📎 ${esc(a.name)}</a><a onclick="cur.att=cur.att.filter(x=>x.id!='${a.id}');event.target.parentElement.remove()">✕</a></div>`).join('')}
<small>Attach receipts (PDF or image) — saved to Google Drive</small><input id="f_files" type="file" multiple accept="image/*,application/pdf">
<button onclick="saveTx('${cur.id}')">Save</button>${t?`<button class="d" onclick="if(confirm('Delete? Drive files stay.')){rm('tx','${cur.id}');closeM()}">Delete</button>`:''}<button class="s" onclick="closeM()">Cancel</button></div>`;
$('#m').className='modal show'}
const closeM=()=>{$('#m').className='modal'};
async function saveTx(id){const g=x=>$('#f_'+x).value,a=Math.abs(parseFloat(g('amt')))||0;
if(!a)return setStatus('Enter an amount');
const t={...cur,id:id||uid(),date:g('date'),desc:g('desc'),amt:g('type')=='e'?-a:a,cat:g('cat'),acc:g('acc'),note:g('note')},files=[...$('#f_files').files];
if(files.length){try{setStatus('Uploading…');const f=await path(S.cfg.root,'Receipts',t.date.slice(0,7));
for(const x of files){const r=await upload(x,f,safe(`${t.date}_${t.desc.slice(0,30)}_${x.name}`));t.att.push({id:r.id,name:x.name,link:r.webViewLink})}}
catch(e){return setStatus('Upload failed: '+e.message)}}
put('tx',t);closeM()}
async function upStm(){const files=[...$('#s_files').files],a=$('#s_acc').value,mon=$('#s_mon').value;if(!files.length||!a||!mon)return setStatus('Pick account, month and file');
try{setStatus('Uploading…');const f=await path(S.cfg.root,'Statements',safe(acc(a).name),mon.slice(0,4));
for(const x of files){const r=await upload(x,f,safe(`${mon}_${x.name}`));S.stm.push({id:uid(),u:now(),acc:a,month:mon,name:x.name,link:r.webViewLink})}save();setStatus('Uploaded')}
catch(e){setStatus('Upload failed: '+e.message)}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='ledger-backup.json';a.click()}
async function imp(f){if(!f)return;try{merge(JSON.parse(await f.text()));save()}catch(e){setStatus('Bad file')}}

(()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#4f8cff';x.fillRect(0,0,180,180);x.font='110px serif';x.textAlign='center';x.fillText('💰',90,130);
const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL();document.head.append(l)})();
render();if(localStorage.getItem(ON)){setStatus('Tap Settings › Sync to reconnect');setTimeout(sync,1200)}
</script></body></html>
