<!doctype html>
<html lang="en" data-t="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115"><title>Ledger</title>
<style>
:root{--bg:#0f1115;--fg:#eceef2;--card:#1a1d24;--mut:#8b93a1;--acc:#4f8cff;--g:#34c38f;--r:#f46a6a}
html[data-t=light]{--bg:#f4f5f8;--fg:#1b1e25;--card:#fff;--mut:#6b7280}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
header span{color:var(--mut);font-size:12px}
main{max-width:900px;margin:auto;padding:0 12px 130px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;text-align:center;padding:8px 0;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;font-size:18px}
nav a small{font-size:11px}nav a.on{color:var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;z-index:7;box-shadow:0 4px 14px #0006}
.card{background:var(--card);border-radius:12px;padding:12px;margin:8px 0}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.row3 .card{margin:0;font-size:12px;color:var(--mut)}
h3{margin:4px 0;color:var(--fg);font-size:16px}h4{margin:16px 4px 4px;color:var(--mut);font-weight:600}
.g{color:var(--g)!important}.r{color:var(--r)!important}
.scroll{overflow-x:auto;display:flex;gap:8px}.scroll .card{min-width:150px;margin:0;cursor:pointer}
.mn{display:flex;justify-content:center;gap:24px;align-items:center;font-size:18px;margin:6px}.mn a{cursor:pointer;padding:4px 12px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{margin:10px 0}.bar i{display:block;height:6px;border-radius:3px;margin-top:4px}
.tw{overflow-x:auto;background:var(--card);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 8px;text-align:left;white-space:nowrap}th{color:var(--mut)}
.n{text-align:right}tr{border-bottom:1px solid #8883}tr[onclick]{cursor:pointer}
input,select,button,textarea{font:inherit;padding:9px;border-radius:8px;border:1px solid #8885;background:var(--bg);color:var(--fg);width:100%;margin:4px 0}
button{background:var(--acc);color:#fff;border:0}button.s{background:#8883;color:var(--fg)}button.d{background:var(--r)}
input[type=color]{padding:2px;height:40px}small{color:var(--mut)}a{color:var(--acc)}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:9;overflow:auto}.modal.show{display:block}
.modal>div{background:var(--card);max-width:480px;margin:5vh auto;padding:16px;border-radius:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:60px 1fr 60px 40px;gap:6px}
.row5{display:grid;grid-template-columns:44px 1fr 80px 46px 36px;gap:6px;align-items:center}.lgl{display:flex;justify-content:center;cursor:pointer;font-size:24px}
.seg{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.seg a{padding:6px 12px;border-radius:16px;background:var(--card);color:var(--mut);white-space:nowrap;cursor:pointer;font-size:13px}.seg a.on{background:var(--acc);color:#fff}
details{background:var(--card);border-radius:12px;margin:8px 0}summary{padding:14px;cursor:pointer;font-weight:600}details>div{padding:0 12px 12px}
.g3{display:grid;grid-template-columns:44px 1fr 36px;gap:6px;align-items:center}.g3b{display:grid;grid-template-columns:1fr 1fr 46px;gap:6px}.acr{border-bottom:1px solid #8883;padding:6px 0}nav a small{font-size:10px}
html[data-t=dark]{color-scheme:dark}html[data-t=light]{color-scheme:light}input[type=date]{min-height:42px}
</style></head><body>
<div id="app"></div><div id="m" class="modal"></div><div id="p" class="modal" style="z-index:10"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const K='ledger.data',CID='ledger.cid',ON='ledger.on',FM='application/vnd.google-apps.folder';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36),now=()=>Date.now(),today=()=>new Date().toLocaleDateString('en-CA');
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{cfg:{name:'Ledger',cur:'RM',accent:'#4f8cff',theme:'dark',root:'Finance Tracker',u:0},
cats:[['c1','Food','🍜','#f59e0b'],['c2','Transport','🚗','#3b82f6'],['c3','Bills','💡','#a855f7'],['c4','Shopping','🛍️','#ec4899'],['c5','Health','🏥','#ef4444'],['c6','Salary','💰','#22c55e'],['c7','Other','📦','#94a3b8']].map(([id,name,i,color])=>({id,name,i,color,u:0})),
accs:[['a1','Cash','#22c55e'],['a2','Bank','#4f8cff']].map(([id,name,color])=>({id,name,color,t:id=='a1'?'cash':'bank',open:0,u:0})),tx:[],stm:[],del:{}};
S.bills=S.bills||[];S.buds=S.buds||[];S.govr=S.govr||[];S.fixed=S.fixed||[];
S.shops=S.shops||[['s1','Shell','🐚'],['s2','Petronas','⛽'],['s3',"Lotus's",'🛒'],['s4','Shopee','🧡'],['s5','Grab','🚖'],['s6','Starbucks','☕']].map(([id,name,i])=>({id,name,i,color:'#94a3b8',u:0}));
[['c8','Fuel','⛽','#f97316'],['c9','Car service','🔧','#14b8a6']].forEach(([id,name,i,color])=>{if(!S.cats.some(c=>c.id==id)&&!(S.del||{})[id])S.cats.push({id,name,i,color,u:0})});
let rt='pl',op={},rf=today().slice(0,8)+'01',rto=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).toLocaleDateString('en-CA'),tab='ov',ym=today().slice(0,7),fa='',q='',cur=null,status='Local only',tok=null,tokExp=0,busy=false,timer;
const acc=id=>S.accs.find(a=>a.id==id)||{name:'?',color:'#888',open:0};
const cat=id=>id=='_dep'?{name:'Depreciation',i:'📉',color:'#94a3b8'}:S.cats.find(c=>c.id==id)||{name:'Uncategorised',i:'❓',color:'#888'};
const sum=l=>l.reduce((s,t)=>s+t.amt,0),bal=(a,d)=>(isL(a)?-(a.open||0):(a.open||0))+TX().reduce((s,t)=>s+(!d||t.date<=d?dl(t,a.id):0),0);
const money=n=>(n<0?'-':'')+S.cfg.cur+' '+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const opts=(l,sel,f)=>l.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${f(x)}</option>`).join('');
const setStatus=m=>{status=m;const e=$('#stat');if(e)e.textContent=m};
const lg=x=>x.logo?`<img src="${x.logo}" style="width:26px;height:26px;border-radius:7px;object-fit:cover;vertical-align:middle">`:esc(x.i||{cash:'💵',bank:'🏦',ewallet:'📱',card:'💳',loan:'📉'}[x.t]||'🏦');
let GT=[];
const gfiles=i=>{const o=[],seen={},okid=v=>typeof v=='string'&&/^[\w-]{25,60}$/.test(v),add=(id,name)=>{if(id&&!seen[id]){seen[id]=1;o.push({id,name:name||'Garage receipt',link:'https://drive.google.com/file/d/'+id+'/view'})}};
const walk=(v,k)=>{if(v==null)return;if(typeof v=='string'){const m=v.match(/\/d\/([\w-]{20,})/)||v.match(/[?&]id=([\w-]{20,})/);if(m)add(m[1]);else if(/^(rid|fid|rids|fids|receipt|receipts|file|files|pdf|photo|photos|img|att)$/i.test(k||'')&&okid(v))add(v)}
else if(Array.isArray(v))v.forEach(x=>walk(x,k));else if(typeof v=='object'){const id=v.fid||v.rid||v.id;if(okid(id))add(id,v.name||v.fname);Object.entries(v).forEach(([a,b])=>walk(b,a))}};
Object.entries(i).forEach(([k,v])=>{if(k!='id'&&k!='car')walk(v,k)});return o};
const gt=()=>{let G=[];try{G=JSON.parse(localStorage.getItem('ledger.g')||'[]')}catch(e){}const car={},ovm={};G.forEach(i=>{if(i.kind=='car')car[i.id]=i.name});(S.govr||[]).forEach(o=>ovm[o.id]=o);
return G.filter(i=>i.date&&+i.cost>0&&i.kind!='car').map(i=>{const f=/fuel|petrol|refuel/i.test(i.kind),what=f?[i.brand,i.place].filter(Boolean).join(' '):[].concat(i.item||i.name||'').map(x=>typeof x=='object'?(x.name||x.item||''):x).filter(Boolean).join(', ');
const b={id:'g:'+i.id,g:1,u:0,date:String(i.date).slice(0,10),desc:(f?'Fuel':'Service')+(car[i.car]?' · '+car[i.car]:'')+(what?' · '+what:''),amt:-Math.abs(+i.cost),cat:f?(S.cfg.gFuel||'c8'):(S.cfg.gSvc||'c9'),acc:S.cfg.gAcc||(S.accs[0]||{}).id,shop:'',note:i.notes||'',att:gfiles(i)},o=ovm[b.id];
return o?(o.h?null:{...b,...o.f,ov:1}):b}).filter(Boolean)};
const FT=()=>S.fixed.filter(a=>a.acc).map(a=>({id:'f:'+a.id,f:1,set:'asset',u:0,date:a.date,desc:'Purchase: '+a.name,amt:-a.cost,cat:'',acc:a.acc,shop:'',note:'',att:[]}));
const TX=()=>S.tx.concat(GT,FT());
function evalF(e,v){try{if(!/^[\w\s+\-*/().,%^]*$/.test(e))return 0;const ok=['cost','res','life','rate','n','nbv','min','max','round','abs'];if((e.match(/[A-Za-z_]\w*/g)||[]).some(x=>!ok.includes(x)))return 0;
const r=Function('cost','res','life','rate','n','nbv','min','max','round','abs','"use strict";return ('+e.replace(/\^/g,'**')+')')(v.cost,v.res,v.life,v.rate,v.n,v.nbv,Math.min,Math.max,Math.round,Math.abs);return isFinite(r)?r:0}catch(x){return 0}}
function annual(a,n,nbv){if(a.m=='rb')return nbv*(a.rate||0)/100;if(a.m=='cu')return evalF(a.expr||'0',{cost:a.cost,res:a.res||0,life:a.life||1,rate:a.rate||0,n,nbv});return(a.cost-(a.res||0))/(a.life||1)}
function dsched(a,months){const o=[];let ac=0,ya=0;for(let m=0;m<months;m++){if(m%12==0)ya=Math.max(0,annual(a,m/12+1,a.cost-ac));const c=Math.min(ya/12,Math.max(0,a.cost-(a.res||0)-ac));ac+=c;o.push(ac)}return o}
function accDep(a,d){if(!a.cost||!a.date)return 0;let m=600;if(d){if(d<a.date)return 0;m=(+d.slice(0,4)-+a.date.slice(0,4))*12+(+d.slice(5,7)-+a.date.slice(5,7))+1}m=Math.min(m,600);return m>0?dsched(a,m)[m-1]:0}
const dayB=f=>{const d=new Date(f+'T00:00:00');d.setDate(d.getDate()-1);return d.toLocaleDateString('en-CA')};
const depIn=(f,t)=>S.fixed.reduce((s,a)=>s+accDep(a,t)-(f?accDep(a,dayB(f)):0),0);
const AT={cash:'Cash',bank:'Bank',ewallet:'E-wallet',card:'Credit card',loan:'Loan'},isL=a=>a.t=='card'||a.t=='loan';
const dl=(t,id)=>t.tr?(t.acc==id?-t.amt:0)+(t.to==id?t.amt:0):(t.acc==id?t.amt:0);
const inR=(d,f,t)=>(!f||d>=f)&&(!t||d<=t),sum2=o=>Object.values(o).reduce((a,b)=>a+b,0);
const paid=(b,d)=>TX().filter(x=>x.set==b.id&&(!d||x.date<=d)).reduce((s,x)=>s+Math.abs(x.amt),0),out=(b,d)=>b.amt-paid(b,d);
const det=(k,t,b)=>`<details ${op[k]?'open':''} ontoggle="op['${k}']=this.open"><summary>${t}</summary><div>${b}</div></details>`;
function PL(f,t){const inc={},exp={};
TX().forEach(x=>{if(x.tr||x.set||!inR(x.date,f,t))return;const m=x.amt>0?inc:exp;m[x.cat]=(m[x.cat]||0)+Math.abs(x.amt)});
S.bills.forEach(b=>{if(!inR(b.date,f,t))return;const m=b.k=='ar'?inc:exp;m[b.cat]=(m[b.cat]||0)+b.amt});const dd=depIn(f,t||today());if(dd>0.005)exp._dep=dd;return{inc,exp}}

/* ---------- storage & merge ---------- */
function save(){localStorage.setItem(K,JSON.stringify(S));render();clearTimeout(timer);timer=setTimeout(sync,1500)}
function put(k,x){const i=S[k].findIndex(y=>y.id==x.id);x.u=now();i<0?S[k].push(x):S[k][i]=x;save()}
function rm(k,id){S[k]=S[k].filter(x=>x.id!=id);S.del[id]=now();save()}
function upd(k,id,f,v){const x=S[k].find(y=>y.id==id);x[f]=v;put(k,x)}
function cfg(f,v){S.cfg[f]=v;S.cfg.u=now();save()}
function merge(r){const del={...S.del};for(const k in r.del||{})del[k]=Math.max(del[k]||0,r.del[k]);
for(const k of['tx','stm','cats','accs','shops','bills','buds','govr','fixed']){const m=new Map();for(const x of[...S[k],...(r[k]||[])]){const o=m.get(x.id);if(!o||x.u>o.u)m.set(x.id,x)}S[k]=[...m.values()].filter(x=>!(del[x.id]>=x.u))}
S.del=del;if(r.cfg&&(r.cfg.u||0)>(S.cfg.u||0))S.cfg=r.cfg}

/* ---------- Google Drive ---------- */
function auth(){return new Promise((res,rej)=>{const id=localStorage.getItem(CID);
if(!id)return rej(new Error('Add your Google Client ID in Settings'));if(!window.google)return rej(new Error('Google script not loaded (offline?)'));
google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive.file',
callback:r=>{if(r.error)return rej(new Error(r.error));tok=r.access_token;tokExp=now()+r.expires_in*1000-60000;localStorage.setItem(ON,'1');res()},
error_callback:e=>rej(new Error(e.type||'auth failed'))}).requestAccessToken({prompt:''})})}
async function api(url,o={}){if(!tok||now()>tokExp)await auth();
const r=await fetch(url,{...o,headers:{Authorization:'Bearer '+tok,...(o.headers||{})}});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));return r}
const D='https://www.googleapis.com/drive/v3/files';
async function find(name,parent,mime){const qs=`name='${name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}' and trashed=false`+(parent?` and '${parent}' in parents`:'')+(mime?` and mimeType='${mime}'`:'');
return((await(await api(D+'?fields=files(id)&q='+encodeURIComponent(qs))).json()).files[0]||{}).id}
async function folder(name,parent){let id=await find(name,parent,FM);if(id)return id;
return(await(await api(D+'?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:FM,...(parent?{parents:[parent]}:{})})})).json()).id}
async function path(...p){let id=null;for(const n of p)id=await folder(n,id);return id}
async function upload(file,parent,name,existing){const fd=new FormData();
fd.append('metadata',new Blob([JSON.stringify({name,...(existing?{}:{parents:[parent]})})],{type:'application/json'}));fd.append('file',file);
return(await api(`https://www.googleapis.com/upload/drive/v3/files${existing?'/'+existing:''}?uploadType=multipart&fields=id,webViewLink`,{method:existing?'PATCH':'POST',body:fd})).json()}
async function blobOf(id){const u=localStorage.getItem(SU);
if(u){const r=await(await fetch(u,{method:'POST',body:JSON.stringify({key:localStorage.getItem(SK)||'',action:'get',fid:id})})).json();if(r.error)throw new Error(r.error);
const b=atob(r.data),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:r.mime})}
return await(await api(`${D}/${id}?alt=media`)).blob()}
async function pv(id){const p=$('#p'),cl=`<button class="s" onclick="$('#p').className='modal'">Close</button>`;p.className='modal show';p.innerHTML='<div><small>Loading preview…</small></div>';
try{const b=await blobOf(id),u=URL.createObjectURL(b),t=b.type;
p.innerHTML=`<div style="max-width:720px">${t.startsWith('image/')?`<img src="${u}" style="width:100%;border-radius:8px">`:t=='application/pdf'?`<iframe src="${u}" style="width:100%;height:70vh;border:0;border-radius:8px"></iframe>`:`<a href="${u}" download>Download file</a>`}${cl}</div>`}
catch(e){p.innerHTML=`<div><small>Preview failed: ${esc(e.message)}</small>${cl}</div>`}}
function logoUp(k,id,f){if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),m=Math.min(im.width,im.height);
x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,96,96);upd(k,id,'logo',c.toDataURL('image/png'))};im.src=URL.createObjectURL(f)}
function shopId(){const n=($('#f_shop').value||'').trim();if(!n)return'';let h=S.shops.find(x=>x.name.toLowerCase()==n.toLowerCase());
if(!h){h={id:uid(),name:n,i:'🏷️',color:'#94a3b8',u:now()};S.shops.push(h)}return h.id}
const SU='ledger.sheet',SK='ledger.key';
async function sync(){const u=localStorage.getItem(SU);if(busy||!(u||localStorage.getItem(ON)))return;busy=true;setStatus('Syncing…');
let ge='';try{if(u){const r=await(await fetch(u,{method:'POST',body:JSON.stringify({key:localStorage.getItem(SK)||'',data:S})})).json();if(r.error)throw new Error(r.error);merge(r.data);ge=r.gerr||'';if(r.garage)localStorage.setItem('ledger.g',JSON.stringify(r.garage))}
else{const root=await path(S.cfg.root),id=await find('data.json',root);if(id)merge(await(await api(`${D}/${id}?alt=media`)).json());
await upload(new Blob([JSON.stringify(S)],{type:'application/json'}),root,'data.json',id)}
localStorage.setItem(K,JSON.stringify(S));setStatus('Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+(ge?' · Garage link error':''))}
catch(e){setStatus('Sync failed — '+String(e.message).slice(0,60));console.warn(e)}busy=false;render()}
async function connect(){try{await auth();await sync()}catch(e){setStatus(e.message)}}
const safe=s=>s.replace(/[\/\\:*?"<>|]/g,'-');
async function trash(ids){for(const id of ids.filter(Boolean)){try{await api(`${D}/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})})}catch(e){if(!/^404/.test(e.message))throw e}}}
const fid=s=>s.fid||((s.link||'').match(/\/d\/([^\/?]+)/)||[])[1];
async function delTx(id){const t=S.tx.find(x=>x.id==id);if(!t||!confirm('Delete this entry? Its receipts will also move to the Google Drive trash.'))return;
try{if((t.att||[]).length){setStatus('Deleting from Drive…');await trash(t.att.map(a=>a.id))}}catch(e){return setStatus('Drive delete failed: '+e.message)}
rm('tx',id);closeM()}
function gReset(id){rm('govr',id);closeM()}
function gHide(id){if(!confirm('Hide this from Ledger? It stays in Garage.'))return;put('govr',{id,f:{},h:1});closeM()}
function gRestore(){S.govr.filter(o=>o.h).forEach(o=>rm('govr',o.id))}
async function renStm(id){const s=S.stm.find(x=>x.id==id),n=prompt('Rename statement',s.name);if(!n||n==s.name)return;
try{if(localStorage.getItem(ON))await api(`${D}/${fid(s)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})}catch(e){setStatus('Renamed in the app only')}
s.name=n;put('stm',s)}
async function delStm(id){const s=S.stm.find(x=>x.id==id);if(!s||!confirm('Delete this statement? The file will also move to the Google Drive trash.'))return;
try{setStatus('Deleting from Drive…');await trash([fid(s)])}catch(e){return setStatus('Drive delete failed: '+e.message)}
rm('stm',id)}

/* ---------- views ---------- */
const go=k=>{tab=k;render();scrollTo(0,0)};
const mo=d=>{const[y,m]=ym.split('-').map(Number),n=new Date(y,m-1+d,1);ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');render()};
function render(){GT=gt();const h=document.documentElement;h.dataset.t=S.cfg.theme;h.style.setProperty('--acc',S.cfg.accent);
const v={ov,tx:reg,rp:rpt,bd:bud,st:stv,set:sett}[tab]();
$('#app').innerHTML=`<header><b>${esc(S.cfg.name)}</b><span id="stat">${esc(status)}</span></header><main>${v}</main>
<nav>${[['ov','📊','Overview'],['tx','🧾','Register'],['rp','📑','Reports'],['bd','🎯','Budget'],['st','🏦','Statements'],['set','⚙️','Settings']].map(([k,i,l])=>`<a class="${tab==k?'on':''}" onclick="go('${k}')">${i}<small>${l}</small></a>`).join('')}</nav>
${tab=='ov'||tab=='tx'?'<button class="fab" onclick="edit()">+</button>':''}`}

+`<button class="s" onclick="put('accs',{id:uid(),name:'New account',t:'bank',color:'#4f8cff',open:0})">+ Add account</button><small>Tap the icon for a logo. Type · opening balance (for credit cards and loans, enter the amount you owe) · colour</small>`)
+det('sh',`🛒 Shops &amp; brands (${S.shops.length})`,S.shops.map(x=>`<div class="row5"><label class="lgl">${lg(x)}<input type="file" accept="image/*" hidden onchange="logoUp('shops','${x.id}',this.files[0])"></label><input value="${esc(x.name)}" onchange="upd('shops','${x.id}','name',this.value)"><input value="${esc(x.i||'')}" placeholder="emoji" onchange="upd('shops','${x.id}','i',this.value)"><input type="color" value="${x.color||'#94a3b8'}" onchange="upd('shops','${x.id}','color',this.value)"><button class="d" onclick="rm('shops','${x.id}')">×</button></div>`).join('')+`<button class="s" onclick="put('shops',{id:uid(),name:'New shop',i:'🏷️',color:'#94a3b8'})">+ Add shop</button>`)
+det('gl','🔗 Garage link',`<small>${GT.length} Garage costs found. They go to this account:</small><select onchange="cfg('gAcc',this.value)">${opts(S.accs,S.cfg.gAcc,a=>esc(a.name))}</select><div class="two"><select onchange="cfg('gFuel',this.value)">${opts(S.cats,S.cfg.gFuel||'c8',k=>k.i+' '+esc(k.name))}</select><select onchange="cfg('gSvc',this.value)">${opts(S.cats,S.cfg.gSvc||'c9',k=>k.i+' '+esc(k.name))}</select></div><small>Fuel category · service category</small><small>Tap a 🔗 entry in the Register to edit it here without changing Garage.</small>${S.govr.some(o=>o.h)?`<button class="s" onclick="gRestore()">Restore ${S.govr.filter(o=>o.h).length} hidden</button>`:''}`)
+det('bk','💾 Backup',`<button class="s" onclick="exp()">Export JSON</button><input type="file" accept=".json" onchange="imp(this.files[0])">`)}

/* ---------- transaction form ---------- */
function edit(id){const t=TX().find(x=>x.id==id);
if(t&&t.f){faEd(t.id.slice(2));return}
cur=t?structuredClone(t):{id:'',date:today(),desc:'',amt:0,cat:(S.cats[0]||{}).id,acc:fa||(S.accs[0]||{}).id,note:'',att:[]};cur.att=cur.att||[];cur.rem=[];
$('#m').innerHTML=`<div><h3>${t?'Edit':'New'} transaction</h3>${t&&t.g?'<small>🔗 From Garage — changes here only affect Ledger, not Garage.</small>':''}<div class="two"><select id="f_type" onchange="tg()"><option value="e">Expense</option><option value="i" ${cur.amt>0&&!cur.tr?'selected':''}>Income</option><option value="t" ${cur.tr?'selected':''}>Transfer / repayment</option></select>
<input id="f_amt" type="number" step="0.01" inputmode="decimal" placeholder="Amount" value="${Math.abs(cur.amt)||''}"></div>
<input id="f_date" type="date" value="${cur.date}"><input id="f_desc" placeholder="Description / payee" value="${esc(cur.desc)}">
<div id="f_c"><select id="f_cat">${opts(S.cats,cur.cat,k=>k.i+' '+esc(k.name))}</select></div><div class="two"><select id="f_acc">${opts(S.accs,cur.acc,a=>esc(a.name))}</select><select id="f_to">${opts(S.accs,cur.to,a=>'→ '+esc(a.name))}</select></div>
<input id="f_shop" list="shl" placeholder="Shop / brand (e.g. Shell, Shopee)" value="${esc((S.shops.find(x=>x.id==cur.shop)||{}).name||'')}"><datalist id="shl">${S.shops.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
<input id="f_note" placeholder="Note" value="${esc(cur.note)}">
${cur.att.map(a=>`<div class="fl"><a onclick="pv('${a.id}')">📎 ${esc(a.name)}</a><a href="${esc(a.link)}" target="_blank" rel="noopener">↗</a><a onclick="cur.rem.push('${a.id}');cur.att=cur.att.filter(x=>x.id!='${a.id}');event.target.parentElement.remove()">✕</a></div>`).join('')}
<small>Attach receipts (PDF or image) — saved to Google Drive</small><input id="f_files" type="file" multiple accept="image/*,application/pdf">
<button onclick="saveTx('${cur.id}')">Save</button>${t&&t.g?`<button class="s" onclick="gReset('${cur.id}')">Reset to Garage</button><button class="d" onclick="gHide('${cur.id}')">Hide from Ledger</button>`:t?`<button class="d" onclick="delTx('${cur.id}')">Delete</button>`:''}<button class="s" onclick="closeM()">Cancel</button></div>`;
$('#m').className='modal show';tg()}
function tg(){const t=$('#f_type').value=='t';$('#f_to').style.display=t?'':'none';$('#f_c').style.display=t?'none':'';$('#f_shop').style.display=t?'none':''}
const closeM=()=>{$('#m').className='modal'};
async function saveTx(id){const g=x=>$('#f_'+x).value,a=Math.abs(parseFloat(g('amt')))||0;
if(!a)return setStatus('Enter an amount');if(g('type')=='t'&&g('to')==g('acc'))return setStatus('Choose two different accounts');
const t={...cur,id:id||uid(),date:g('date'),desc:g('desc'),amt:g('type')=='e'?-a:a,tr:g('type')=='t'?1:0,to:g('type')=='t'?g('to'):'',cat:g('cat'),acc:g('acc'),note:g('note'),shop:shopId()},files=[...$('#f_files').files],rem=cur.rem||[];delete t.rem;
if(files.length){try{setStatus('Uploading…');const f=await path(S.cfg.root,'Receipts',t.date.slice(0,7));
for(const x of files){const r=await upload(x,f,safe(`${t.date}_${t.desc.slice(0,30)}_${x.name}`));t.att.push({id:r.id,name:x.name,link:r.webViewLink})}}
catch(e){return setStatus('Upload failed: '+e.message)}}
if(t.g){put('govr',{id:t.id,h:0,f:{date:t.date,desc:t.desc,amt:t.amt,cat:t.cat,acc:t.acc,shop:t.shop,note:t.note,att:t.att}});closeM();return}
if(rem.length){try{await trash(rem)}catch(e){}}put('tx',t);closeM()}
async function upStm(){const files=[...$('#s_files').files],a=$('#s_acc').value,f=$('#s_from').value,t=$('#s_to').value;if(!files.length||!a||!f||!t)return setStatus('Pick account, dates and file');
try{setStatus('Uploading…');const d=await path(S.cfg.root,'Statements',safe(acc(a).name),f.slice(0,4));
for(const x of files){const r=await upload(x,d,safe(`${f}_to_${t}_${x.name}`));S.stm.push({id:uid(),u:now(),fid:r.id,acc:a,from:f,to:t,month:f.slice(0,7),name:x.name,link:r.webViewLink})}save();setStatus('Uploaded')}
catch(e){setStatus('Upload failed: '+e.message)}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='ledger-backup.json';a.click()}
async function imp(f){if(!f)return;try{merge(JSON.parse(await f.text()));save()}catch(e){setStatus('Bad file')}}

rr(32,58,116,78,16);x.stroke();x.beginPath();x.moveTo(48,58);x.lineTo(112,36);x.lineTo(122,58);x.stroke();
rr(102,84,46,28,10);x.stroke();x.beginPath();x.arc(120,98,4.5,0,7);x.fillStyle=A;x.fill();

document.addEventListener('click',e=>{const t=e.target;if(t&&t.matches&&t.matches('input[type=date],input[type=month]')&&t.showPicker){try{t.showPicker()}catch(x){}}});
render();if(localStorage.getItem(SU))setTimeout(sync,800);else if(localStorage.getItem(ON)){setStatus('Tap Settings › Sync to reconnect');setTimeout(sync,1200)}
